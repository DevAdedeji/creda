name: creda

services:
  db:
    image: postgres:18-alpine
    container_name: creda-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: creda
      POSTGRES_PASSWORD: creda
      POSTGRES_DB: creda
    ports:
      - '127.0.0.1:5444:5432'
    volumes:
      - creda-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U creda -d creda']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  creda-postgres-data:
